spring.application.name=backend

server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info

# Database
spring.datasource.url=${spring-datasource-url}
spring.datasource.username=${spring-datasource-username}
spring.datasource.password=${spring-datasource-password}
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Required secrets: no fallback value, but an EMPTY default (the trailing ':')
# on purpose. With no default at all, Spring binds an unset variable as the
# literal text "${VAR}", which passes the "must be set" checks. Empty makes
# them fail at startup instead.

# Signs login tokens. convo-file-sharing and convo-audio-watermark must be
# given the same value to verify them.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# See InternalServiceProperties. Must match the value convo-file-sharing and
# convo-audio-watermark are configured with.
app.internal.service-key=${INTERNAL_SERVICE_KEY:}
